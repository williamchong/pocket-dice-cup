<!-- The loading screen, kept until the dice are ready (index.vue). It is the
     felt, the die and the name before any script or stylesheet arrives, laid
     out as the iOS launch screen so the two hand over without a jump. -->
<div id="splash">
  <style>
    #splash {
      position: fixed;
      inset: 0;
      z-index: 10;
      background: #12241b;
      color: #f4efe3;
      font-family: system-ui, -apple-system, sans-serif;
      text-align: center;
      /* FADE_MS in app/utils/splash.ts. */
      transition: opacity 0.4s ease;
    }

    /* Taps reach the cup as soon as it starts to fade. */
    #splash.splash--gone {
      opacity: 0;
      pointer-events: none;
    }

    #splash .splash__die {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 96px;
      height: 96px;
      translate: -50% -50%;
    }

    /* The die turns up a new face every 0.2 s: each face shows for its sixth
       of the cycle, the 5 of the launch screen first, and is tipped its own
       way, so the die rocks as the faces change. Each face is a whole image
       whose opacity is animated, which runs off the main thread, so the die
       keeps rolling while the engine loads and holds that thread. The iOS app
       draws the same faces natively (DiceCupViewController). */
    #splash .face {
      position: absolute;
      inset: 0;
      opacity: 0;
      animation: splash-face 1.2s linear infinite;
    }

    #splash .face:nth-of-type(2) { rotate: -8deg; animation-delay: 0.2s; }
    #splash .face:nth-of-type(3) { rotate: 8deg; animation-delay: 0.4s; }
    #splash .face:nth-of-type(4) { rotate: -8deg; animation-delay: 0.6s; }
    #splash .face:nth-of-type(5) { rotate: 8deg; animation-delay: 0.8s; }
    #splash .face:nth-of-type(6) { rotate: -8deg; animation-delay: 1s; }

    /* Linear between equal values, then a jump: a step that the compositor
       runs too. */
    @keyframes splash-face {
      0%, 16.666% { opacity: 1; }
      16.667%, 100% { opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      #splash .face {
        animation: none;
      }

      #splash .face:first-of-type {
        opacity: 1;
      }
    }

    #splash .splash__text {
      position: absolute;
      top: calc(50% + 72px);
      right: 0;
      left: 0;
    }

    #splash p {
      margin: 0;
    }

    #splash .splash__name {
      font-size: 24px;
      font-weight: 600;
    }

    #splash .splash__status {
      margin-top: 12px;
      opacity: 0.7;
    }
  </style>
  <div class="splash__die" aria-hidden="true">
    <img class="face" width="96" height="96" alt="" src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 96 96'><rect x='4' y='4' width='88' height='88' rx='20' fill='%23f4efe3'/><g fill='%2312241b'><circle cx='28' cy='28' r='8'/><circle cx='68' cy='28' r='8'/><circle cx='48' cy='48' r='8'/><circle cx='28' cy='68' r='8'/><circle cx='68' cy='68' r='8'/></g></svg>">
    <img class="face" width="96" height="96" alt="" src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 96 96'><rect x='4' y='4' width='88' height='88' rx='20' fill='%23f4efe3'/><g fill='%2312241b'><circle cx='28' cy='28' r='8'/><circle cx='68' cy='68' r='8'/></g></svg>">
    <img class="face" width="96" height="96" alt="" src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 96 96'><rect x='4' y='4' width='88' height='88' rx='20' fill='%23f4efe3'/><g fill='%2312241b'><circle cx='28' cy='28' r='8'/><circle cx='68' cy='28' r='8'/><circle cx='28' cy='48' r='8'/><circle cx='68' cy='48' r='8'/><circle cx='28' cy='68' r='8'/><circle cx='68' cy='68' r='8'/></g></svg>">
    <img class="face" width="96" height="96" alt="" src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 96 96'><rect x='4' y='4' width='88' height='88' rx='20' fill='%23f4efe3'/><g fill='%2312241b'><circle cx='28' cy='28' r='8'/><circle cx='48' cy='48' r='8'/><circle cx='68' cy='68' r='8'/></g></svg>">
    <img class="face" width="96" height="96" alt="" src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 96 96'><rect x='4' y='4' width='88' height='88' rx='20' fill='%23f4efe3'/><g fill='%2312241b'><circle cx='48' cy='48' r='8'/></g></svg>">
    <img class="face" width="96" height="96" alt="" src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 96 96'><rect x='4' y='4' width='88' height='88' rx='20' fill='%23f4efe3'/><g fill='%2312241b'><circle cx='28' cy='28' r='8'/><circle cx='68' cy='28' r='8'/><circle cx='28' cy='68' r='8'/><circle cx='68' cy='68' r='8'/></g></svg>">
  </div>
  <div class="splash__text">
    <p class="splash__name">Pocket Dice Cup</p>
    <p class="splash__status">Loading…</p>
  </div>
  <!-- In the reader's language, chosen as pickLocale chooses (app/utils/locale.ts),
       which loads only with the app; tests/locale.test.ts checks the two agree. -->
  <script>
    (function () {
      var languages = navigator.languages || [navigator.language]
      for (var i = 0; i < languages.length; i++) {
        var parts = languages[i].toLowerCase().split(/[-_]/)
        if (parts[0] === 'en') return
        if (parts[0] === 'zh') {
          var traditional = parts.some(function (part) { return ['hant', 'hk', 'mo', 'tw'].indexOf(part) >= 0 })
          document.querySelector('#splash .splash__name').textContent = '口袋骰盅'
          document.querySelector('#splash .splash__status').textContent = traditional ? '載入中…' : '加载中…'
          return
        }
      }
    })()
  </script>
</div>
